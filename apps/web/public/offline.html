<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhandsMusic Web - 离线</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .offline-container {
      text-align: center;
      padding: 40px;
    }
    
    .offline-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    p {
      color: #b3b3b3;
      margin-bottom: 20px;
    }
    
    button {
      background-color: #1db954;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #1ed760;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">🎵</div>
    <h1>您当前处于离线状态</h1>
    <p>请检查网络连接后重试</p>
    <button onclick="window.location.reload()">重新加载</button>
  </div>
</body>
</html>
