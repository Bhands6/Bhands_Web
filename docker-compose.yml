services:
  bhandsmusic:
    build: .
    container_name: bhandsmusic-web
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      # 在根目录 .env 中配置（ADMIN_TOKEN / CORS_ORIGINS / STREAM_HOST_ALLOWLIST / DATA_DIR /
      # SESSION_PERSIST / TRUST_PROXY）
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - STREAM_HOST_ALLOWLIST=${STREAM_HOST_ALLOWLIST:-}
      - DATA_DIR=${DATA_DIR:-/app/data}
      # 登录会话持久化：部署默认关闭（磁盘不留登录凭据）；本地测试才在 .env 设 SESSION_PERSIST=on
      - SESSION_PERSIST=${SESSION_PERSIST:-}
      # 仅在启用下方 caddy 反代 profile 时于 .env 设 TRUST_PROXY=1；直连暴露 3001 必须留空（防 XFF 伪造绕限流）
      - TRUST_PROXY=${TRUST_PROXY:-}
    volumes:
      # LX 脚本存档持久化到宿主机，容器重建不丢（登录 cookie 仅 SESSION_PERSIST=on 时才落盘这里）
      - ./data:/app/data
    restart: unless-stopped

  # HTTPS 反向代理（备案通过后启用：docker compose --profile caddy up -d）
  caddy:
    image: caddy:alpine
    container_name: bhandsmusic-caddy
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/bhands.icu_nginx:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bhandsmusic
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
